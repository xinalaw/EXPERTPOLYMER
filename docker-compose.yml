# Весь стек: docker compose up -d --build --wait
# Без torch: ./scripts/docker-up.sh --mock
x-app-build: &app-build
  context: .
  dockerfile: Dockerfile
  target: ml

x-app-environment: &app-environment
  # Внутри Docker используются имена сервисов, а не localhost из локального .env.
  DATABASE_URL: postgresql+psycopg2://${DB_USER:-postgres}:${DB_PASSWORD:-admin}@db:5432/${DB_NAME:-scientific_system}
  SECRET_KEY: ${SECRET_KEY:-development-only-change-me}
  ALGORITHM: ${ALGORITHM:-HS256}
  ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
  CELERY_BROKER_URL: redis://redis:6379/0
  CELERY_RESULT_BACKEND: redis://redis:6379/0
  ML_BACKEND: ${ML_BACKEND:-auto}
  ML_STRICT: ${ML_STRICT:-0}
  ES_MODEL_PATH: /srv/data/models/yolo_particles_seg.pt

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${DB_NAME:-scientific_system}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-admin}
    ports:
      - "${DB_PORT:-5434}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: *app-build
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment: *app-environment
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app/static:/srv/backend/app/static
      # Замена весов не требует пересборки образа.
      - ./data/models:/srv/data/models:ro
    command: >
      sh -c "alembic upgrade head &&
             exec uvicorn app.main:app --host 0.0.0.0 --port 8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/', timeout=5)"]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 15s

  worker:
    build: *app-build
    depends_on:
      # API становится healthy только после успешного alembic upgrade head.
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment: *app-environment
    volumes:
      - ./backend/app/static:/srv/backend/app/static
      - ./data/models:/srv/data/models:ro
    command: celery -A app.tasks.celery_app worker --loglevel=info
    healthcheck:
      test: ['CMD-SHELL', 'celery -A app.tasks.celery_app inspect ping --destination "celery@$$HOSTNAME" --timeout 5']
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 15s

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      target: frontend
    depends_on:
      backend:
        condition: service_healthy
    environment:
      VITE_API_URL: ""
      API_PROXY_TARGET: http://backend:8000
    ports:
      - "5173:5173"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5173/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  postgres_data:
  redis_data:
