# Объединённый стек: PostgreSQL + Redis + FastAPI + Celery-воркер.
#
# Фронтенд вынесен в профиль frontend, чтобы обычный `docker compose up`
# не тянул npm install:
#     docker compose --profile frontend up

services:
  db:
    image: postgres:16
    container_name: scientific_system_db
    environment:
      POSTGRES_DB: scientific_system
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d scientific_system" ]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: scientific_system_backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:admin@db:5432/scientific_system
      SECRET_KEY: your_secret_key
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      # auto — экспертная система, если веса на месте; иначе заглушка
      ML_BACKEND: auto
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app/static:/srv/backend/app/static
      # Веса модели подключены томом: замена модели не требует пересборки
      - ./data/models:/srv/data/models:ro
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"

  redis:
    image: redis:7
    container_name: scientific_system_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 5

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: scientific_system_worker
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:admin@db:5432/scientific_system
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      SECRET_KEY: your_secret_key
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
      ML_BACKEND: auto
    volumes:
      - ./backend/app/static:/srv/backend/app/static
      - ./data/models:/srv/data/models:ro
    command: celery -A app.tasks.celery_app worker --loglevel=info

  frontend:
    profiles: [ "frontend" ]
    image: node:22-alpine
    container_name: scientific_system_frontend
    working_dir: /app
    depends_on:
      - backend
    environment:
      API_PROXY_TARGET: http://backend:8000
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      # Отдельный том: node_modules контейнера (Linux) не затирают хостовые
      - frontend_node_modules:/app/node_modules
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"

volumes:
  postgres_data:
  frontend_node_modules:
