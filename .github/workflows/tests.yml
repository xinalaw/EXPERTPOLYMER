name: Tests

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run format:check
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  # Ядро экспертной системы: метрики и нечёткий вывод.
  # Веса YOLO и torch не нужны — ultralytics в базовый requirements.txt не входит.
  expert-system:
    name: Expert system core
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run core tests
        run: pytest --cov=expert_system --cov-report=term-missing

  backend:
    name: Backend API
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: scientific_system_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: admin
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d scientific_system_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      TEST_DATABASE_URL: postgresql+psycopg2://postgres:admin@localhost:5432/scientific_system_test
      DATABASE_URL: postgresql+psycopg2://postgres:admin@localhost:5432/scientific_system_test
      SECRET_KEY: test_secret_key
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
      # Тесты API проверяют контракт, а не качество модели: гоняем заглушку,
      # чтобы не тянуть в CI ~2 ГБ весов torch.
      ML_BACKEND: mock

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run backend tests
        working-directory: backend
        # Корень репозитория в PYTHONPATH: backend импортирует пакет
        # expert_system, лежащий рядом с ним
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: pytest --cov=app --cov-report=term-missing
